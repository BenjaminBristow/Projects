<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Train Route Planner</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Manchester Metrolink</h1>
        <p>Route Planner</p>

        <div class="route-form">

            <label for="start">Start Station</label>
            <input 
                type="text" 
                id="start" 
                placeholder="Enter starting station"
            >

            <label for="destination">Destination</label>
            <input 
                type="text" 
                id="destination" 
                placeholder="Enter destination"
            >

            <div class="buttons">
                <button id="fastestButton">
                    Find Fastest Route
                </button>

                <button id="changesButton">
                    Find Fewest Changes
                </button>
            </div>

        </div>

        <div id="result">
            Your route will appear here.
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
